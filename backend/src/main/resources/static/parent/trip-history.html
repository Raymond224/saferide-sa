<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip History - SafeRide SA</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      SafeRide SA
      <span>Parent Portal</span>
    </div>

    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="trip-status.html">Trip Status</a>
      <a href="trip-history.html" class="active">Trip History</a>
      <a href="report-incident.html">Report Incident</a>
      <a href="messages.html">Messages</a>
      <a href="#" class="logout-link">Logout</a>
    </nav>
  </aside>

  <div class="main">

    <header class="topbar">
      <h1>Trip History</h1>

      <div class="user-chip">
        <div class="avatar">--</div>
        <div>Loading...</div>
      </div>
    </header>

    <div class="content">

      <div class="page-head">
        <div>
          <h2>Completed Trips</h2>
          <p>
            Past trips your children were on, with pick-up and
            drop-off times.
          </p>
        </div>
      </div>

      <div class="card panel">

        <div class="panel-title">
          <h3>History</h3>
        </div>

        <div class="table-wrap">
          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Route</th>
                <th>Operator</th>
                <th>Vehicle</th>
                <th>Details</th>
              </tr>
            </thead>

            <tbody id="historyBody">
              <tr>
                <td colspan="5" class="empty">
                  Loading...
                </td>
              </tr>
            </tbody>

          </table>
        </div>

      </div>

      <p class="footer-note">
        SafeRide SA - Parent Portal
      </p>

    </div>
  </div>
</div>

<script src="../js/parent-trip-history.js"></script>
</body>
</html>
