<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Audit Logs | SafeRide SA</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app">
<aside class="sidebar">
  <div class="brand">SafeRide SA<span>System Administrator</span></div>
  <nav class="nav">
    <a href="dashboard.html">▦ Dashboard</a>
    <a href="users.html">♙ User Management</a>
    <a href="schools.html">▣ School Management</a>
    <a href="audit-logs.html" class="active">◷ Audit Logs</a>
    <a href="#" class="logout-link">Logout</a>
  </nav>
</aside>
<main class="main">
<header class="topbar">
  <h1>SafeRide SA</h1>
  <div class="user-chip"><span>System Administrator</span><div class="avatar">SA</div></div>
</header>
<section class="content">
<div class="page-head">
  <div>
    <h2>Audit Logs</h2>
    <p>Every significant action performed on the SafeRide SA system.</p>
  </div>
</div>

<div class="cards">
  <div class="card stat">
    <div class="label">Total events</div>
    <div class="value" id="statTotal">—</div>
  </div>
  <div class="card stat">
    <div class="label">Latest event</div>
    <div class="value" id="statLatest" style="font-size:1rem">—</div>
  </div>
</div>

<div class="card panel">
  <div class="panel-title">
    <h3>Recent Activity</h3>
    <div class="filters" style="margin:0">
      <input class="input" id="auditSearch" placeholder="Search details or user...">
      <select class="select" id="auditActionFilter">
        <option value="">All actions</option>
      </select>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>User</th>
          <th>Action</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="auditTable">
        <tr><td colspan="4" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
</section>
</main>
</div>
<script src="js/audit.js"></script>
</body></html>
