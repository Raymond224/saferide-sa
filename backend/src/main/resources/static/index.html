<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRide SA — Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #123B5D 0%, #1F7A8C 100%);
  }
  .login-card {
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 400px;
  }
  .login-card h1 { margin: 0 0 6px; color: #123B5D; font-size: 26px; }
  .login-card .sub { color: #6B7280; font-size: 14px; margin-bottom: 28px; }
  .login-card .form-group { margin-bottom: 16px; }
  .login-card label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .login-card input:focus { border-color: #1F7A8C; box-shadow: 0 0 0 3px rgba(31,122,140,.15); }
  .login-card button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #123B5D;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
  }
  .login-card button:hover { background: #0B2A43; }
  .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }
  .err {
    background: #FEE2E2;
    color: #991B1B;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .err.show { display: block; }
  .demo-hint {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #E5E7EB;
    font-size: 12px;
    color: #6B7280;
  }
  .demo-hint code {
    background: #F4F7FA;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>SafeRide SA</h1>
    <p class="sub">Learner transport safety system</p>

    <div class="err" id="err"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginBtn">Sign in</button>
    </form>

    <div class="demo-hint">
      <strong>Demo accounts</strong> (password: <code>password123</code>)<br>
      <code>sysadmin</code> · <code>admin</code> · <code>operator</code> · <code>parent</code>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
